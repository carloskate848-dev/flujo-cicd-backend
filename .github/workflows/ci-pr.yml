name: CI - Pull Request a preprod

# Corresponde a los pasos "Pull request", "JaCoCo (Java)",
# "Trivy / OWASP DC" y "Quality gate" del diagrama de flujo.
# NOTA: el paso "SonarCloud (cobertura y calidad)" del diagrama se
# implementa aquí de forma 100% nativa de GitHub (sin cuenta externa):
# JaCoCo genera la cobertura y el job "cobertura-comentario" la publica
# como comentario en el Pull Request, fallando si cae debajo del umbral.
on:
  pull_request:
    branches: [preprod]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-y-tests:
    name: Build + JaCoCo (cobertura Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testear y verificar cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

  cobertura-comentario:
    name: Cobertura y calidad (JaCoCo, comentario en el PR)
    runs-on: ubuntu-latest
    needs: [build-y-tests]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests + reporte JaCoCo
        run: ./mvnw -B clean verify

      # Publica la cobertura como comentario en el PR y falla el job si
      # cae debajo de los umbrales (equivalente al "quality gate" de
      # cobertura que antes daba SonarCloud). No requiere ninguna cuenta
      # externa: usa el GITHUB_TOKEN que GitHub Actions provee automáticamente.
      - name: Comentar cobertura en el Pull Request
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Reporte de cobertura (JaCoCo)'
          min-coverage-overall: 60
          min-coverage-changed-files: 60

  seguridad-sca:
    name: Trivy / OWASP (vulnerabilidades de dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Se compila sin tests solo para tener el árbol de dependencias resuelto
      - name: Resolver dependencias
        run: ./mvnw -B -DskipTests package

      - name: Trivy - escaneo de dependencias (SCA)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [build-y-tests, cobertura-comentario, seguridad-sca]
    if: always()
    steps:
      - name: Verificar que todos los checks pasaron
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Uno o más checks fallaron. Bloqueando merge a preprod."
            exit 1
          fi
          echo "Todos los checks pasaron correctamente."

# Nota: para que este job actúe como el "Quality gate" real del diagrama,
# configura en GitHub → Settings → Branches → Branch protection rules
# la rama "preprod" exigiendo el status check "Quality gate" y al menos
# una aprobación de code review antes de permitir el merge.