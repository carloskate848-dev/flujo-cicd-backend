name: CI - Pull Request a preprod

# Corresponde a los pasos "Pull request", "JaCoCo (Java)", "SonarCloud",
# "Trivy / OWASP DC" y "Quality gate" del diagrama de flujo.
on:
  pull_request:
    branches: [preprod]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-y-tests:
    name: Build + JaCoCo (cobertura Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, testear y verificar cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14

  sonarcloud:
    name: SonarCloud (cobertura y calidad)
    runs-on: ubuntu-latest
    needs: [build-y-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo para el análisis de PR

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cachear paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Requiere el secreto SONAR_TOKEN configurado en el repositorio
      # (Settings > Secrets and variables > Actions) y el proyecto creado
      # previamente en https://sonarcloud.io
      - name: Tests + análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  seguridad-sca:
    name: Trivy / OWASP (vulnerabilidades de dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Se compila sin tests solo para tener el árbol de dependencias resuelto
      - name: Resolver dependencias
        run: ./mvnw -B -DskipTests package

      - name: Trivy - escaneo de dependencias (SCA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [build-y-tests, sonarcloud, seguridad-sca]
    if: always()
    steps:
      - name: Verificar que todos los checks pasaron
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Uno o más checks fallaron. Bloqueando merge a preprod."
            exit 1
          fi
          echo "Todos los checks pasaron correctamente."

# Nota: para que este job actúe como el "Quality gate" real del diagrama,
# configura en GitHub → Settings → Branches → Branch protection rules
# la rama "preprod" exigiendo el status check "Quality gate" y al menos
# una aprobación de code review antes de permitir el merge.
