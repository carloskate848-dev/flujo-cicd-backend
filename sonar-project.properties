# Configuración de SonarCloud para flujo-cicd-backend.
# Reemplaza projectKey y organization por los que te asigna sonarcloud.io
# al crear el proyecto (Import a GitHub repository). Estos valores también
# se pueden pasar como variables de GitHub Actions (SONAR_PROJECT_KEY,
# SONAR_ORGANIZATION) en vez de dejarlos fijos aquí.
sonar.projectKey=tu-org_flujo-cicd-backend
sonar.organization=tu-org

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Reporte de cobertura generado por JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.sourceEncoding=UTF-8
